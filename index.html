        h+=`<div data-act="round" data-si="${si}" data-ri="${i}" style="width:34px;height:34px;border-radius:8px;border:1.5px solid ${on?C.lime:C.muted};background:${on?C.lime:"transparent"};color:${on?"#0a0a0f":C.muted};display:flex;align-items:center;justify-content:center;font-family:${F.mono};font-size:12px;font-weight:700;cursor:pointer">${i+1}</div>`; }

  return h;

// ── Train ──

  const row=(k,v,c)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:${C.card};border-radius:8px;margin-bottom:5px;align-items:flex-start"><span style="font-family:${F.mono};font-size:11px;color:${c||C.muted};font-weight:600;white-space:nowrap">${e(k)}</span><span style="font-size:11.5px;color:${C.muted};line-height:1.5;text-align:right">${v}</span></div>`;

    h+=`<div data-act="fuel" data-v="${id}" style="flex:1;padding:8px 4px;border-radius:8px;background:${on?C.lime:"transparent"};color:${on?"#0a0a0f":C.muted};font-family:${F.mono};font-size:9.5px;letter-spacing:.04em;font-weight:${on?700:400};cursor:pointer;white-space:nowrap;text-align:center">${l}</div>`; });
  h+=`</div>`;
  if(S.fuel==="daily"){
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px">`;
    [["Training","2,550",C.blue],["Big/Sim","2,850",C.lime],["Rest","2,150",C.muted]].forEach(([l,k,c])=>{
      h+=`<div style="background:${C.card};border:1px solid ${c};border-radius:10px;padding:11px 8px;text-align:center"><div style="font-family:${F.mono};font-size:8px;color:${c};text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">${l}</div><div style="font-family:${F.disp};font-size:24px;color:${c};line-height:1">${k}</div><div style="font-family:${F.mono};font-size:8px;color:${C.muted}">kcal</div></div>`; });
    h+=`</div><div style="display:flex;gap:8px;margin-top:8px;font-family:${F.mono};font-size:11px;justify-content:center;color:${C.text}"><span>P <b style="color:${C.blue}">148g</b></span><span style="color:${C.muted}">·</span><span>C <b style="color:${C.lime}">340–400g</b></span><span style="color:${C.muted}">·</span><span>F <b style="color:${C.orange}">~62g</b></span></div>
    <div style="background:rgba(71,200,255,.06);border:1px solid rgba(71,200,255,.2);border-radius:10px;padding:11px 12px;margin-top:12px;font-size:12px;color:${C.muted};line-height:1.6">Your desk day + 10k steps already burns ~2,150 kcal before training — so training food goes <b style="color:${C.text}">on top</b>, not instead. Protein anchors ~148g every day; carbs are the lever that moves with the work.</div>`;
    h+=SH("Training Day on a Plate");
    [["Pre (5–6am)","2 rice cakes + honey (+ banana on hard mornings)"],["Post-session","Oats 80g + whey + banana + berries + honey — biggest carb hit"],["Lunch","Chicken breast or cod + rice/potatoes + veg (spray oil)"],["Snack","Greek yoghurt + fruit + granola, or cottage cheese + oatcakes"],["Dinner","Prawn or tofu stir-fry + noodles/rice — carbs up before hard days"]].forEach(([k,v])=>h+=row(k,v,C.blue));
  } else if(S.fuel==="morning"){
    h+=SH("Early Sessions — your setup");
    [["Rice cakes + honey","~30–35g carbs — fine for easy/short. Light for hard intervals/engine/sim, so top up."],["Top-up (hard AM)","Add a banana or 2–3 dates, or a small bowl of oats if it sits well. Juice works if solids are hard at 5am."],["The real lever","Night-before carb-rich dinner does most of the work — you train on yesterday's glycogen."],["Straight after","Full breakfast within 60–90 min — biggest carb + protein hit of the day."]].forEach(([k,v])=>h+=row(k,v,C.lime));
  } else if(S.fuel==="timing"){

  } else {
    h+=SH("Are You Eating Enough?",C.orange);
    h+=`<div style="background:rgba(251,146,60,.06);border:1px solid rgba(251,146,60,.25);border-radius:10px;padding:12px 13px;font-size:12.5px;color:${C.muted};line-height:1.7">If two or more creep in, <b style="color:${C.text}">eat more — mostly carbs</b>, don't train harder:<div style="margin-top:8px">`;

    h+=`</div><div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)">That last one is the clearest low-fuel signal — add fuel and check in with a GP or sports dietitian. At your body-fat level, fuelling up is the fix, and it's not negotiable during hard prep.</div></div>`;
  }

  return h;

    h+=`<div style="display:flex;gap:8px;align-items:center;padding:5px 0"><div style="width:3px;align-self:stretch;background:${c};border-radius:2px;min-height:14px"></div><div style="font-size:12px;color:${C.text}">${l}</div></div>`; });
  if(entries.length){ h+=`<div style="font-family:${F.mono};font-size:9px;color:${C.muted};letter-spacing:.12em;text-transform:uppercase;margin:16px 0 6px">History</div>`;
    entries.forEach((en,i)=>{ h+=`<div style="background:${C.card};border:1px solid ${C.border};border-radius:9px;padding:9px 12px;margin-bottom:5px"><div style="font-family:${F.mono};font-size:9px;color:${C.purple};margin-bottom:3px">${i===0?"BASELINE · ":""}${en.date}</div><div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:${C.text}">${en.weight?`<span>⚖ ${en.weight}kg</span>`:""}${en.smm?`<span>💪 ${en.smm} SMM</span>`:""}${en.pbf?`<span>📊 ${en.pbf}%</span>`:""}${en.score?`<span>🔥 ${en.score}</span>`:""}</div></div>`; }); }
  h+=`<div style="margin-top:16px;background:${C.surface};border:1px solid rgba(192,132,252,.3);border-radius:11px;padding:14px">
    <div style="font-family:${F.mono};font-size:9px;color:${C.purple};letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px">Log New InBody</div>
    <input data-bf="date" type="date" value="${new Date().toISOString().split("T")[0]}" style="width:100%;background:${C.card};border:1px solid ${C.border};border-radius:7px;padding:8px 10px;color:${C.text};font-size:12px;outline:none;margin-bottom:8px;box-sizing:border-box"/>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">`;
  [["weight","Weight kg"],["smm","SMM kg"],["pbf","Body Fat %"],["bmr","BMR"],["vfa","VFA cm²"],["score","Score"]].forEach(([k,l])=>{
    h+=`<input data-bf="${k}" type="number" inputmode="decimal" placeholder="${l}" style="width:100%;background:${C.card};border:1px solid ${C.border};border-radius:7px;padding:8px;color:${C.text};font-size:13px;outline:none;text-align:center;box-sizing:border-box"/>`; });
  h+=`</div><button data-act="bodysave" style="width:100%;padding:13px;border-radius:10px;border:1px solid ${C.purple};background:${C.purple};color:#0a0a0f;font-family:${F.disp};font-size:15px;letter-spacing:.06em;cursor:pointer">SAVE ENTRY</button></div></div>`;
  return h;
}

// ── Progress ──
function progress(){
  let done=0;const total=66;
  let rows="";
  for(let w=1;w<=11;w++){ const days=getDays(w);
    let cells="";
    days.forEach((d,di)=>{ const c=(DATA[`w${w}d${di}`]||{}).completed; if(c)done++;
      cells+=`<div data-act="jump" data-w="${w}" data-d="${di}" style="flex:1;height:30px;border-radius:6px;border:1px solid ${c?C.green:C.border};background:${c?"rgba(106,255,71,.18)":d.rest?"rgba(255,255,255,.02)":"transparent"};color:${c?C.green:C.muted};display:flex;align-items:center;justify-content:center;font-family:${F.mono};font-size:9px;font-weight:600;cursor:pointer">${c?"✓":e(d.num)}</div>`; });
    rows+=`<div style="margin-bottom:8px"><div style="font-family:${F.mono};font-size:9px;color:${phOf(w)===3?C.lime:C.muted};margin-bottom:4px;letter-spacing:.08em">WEEK ${w} · ${PHASES[phOf(w)-1].title}</div><div style="display:flex;gap:4px">${cells}</div></div>`; }
  const pct=Math.round(done/total*100);
  return `<div class="fade"><div style="font-family:${F.disp};font-size:30px;letter-spacing:.03em;color:${C.text}">PROGRESS</div>
    <div style="font-family:${F.mono};font-size:10px;color:${C.muted};margin-bottom:14px">${done} of ${total} sessions · 🏁 ${dtr()} days to race</div>
    <div style="background:${C.card};border:1px solid ${C.border};border-radius:11px;padding:14px;margin-bottom:16px;text-align:center"><div style="font-family:${F.disp};font-size:44px;color:${C.lime};line-height:1">${pct}%</div><div style="margin:8px 0">${bar(pct,C.lime)}</div><div style="font-family:${F.mono};font-size:10px;color:${C.muted}">programme complete</div></div>${rows}</div>`;
}

// ── Shell + render ──
function render(){
  const TABS=[["train","Train","🏋️"],["fuel","Fuel","🍽️"],["body","Body","📊"],["progress","Progress","📈"]];
  let inner=S.view==="train"?train():S.view==="fuel"?fuel():S.view==="body"?body():progress();
  let tabbar=`<div style="position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(20,20,28,.96);border-top:1px solid ${C.border};display:flex;padding:8px 8px 10px">`;
  TABS.forEach(([id,l,ic])=>{ const on=S.view===id;
    tabbar+=`<div data-act="tab" data-v="${id}" style="flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:${on?C.lime:C.muted}"><span style="font-size:18px;opacity:${on?1:.6}">${ic}</span><span style="font-family:${F.mono};font-size:9px;letter-spacing:.05em">${l}</span></div>`; });
  tabbar+=`</div>`;
  document.getElementById("root").innerHTML=
    `<div style="max-width:480px;margin:0 auto;min-height:100vh;background:${C.bg};color:${C.text}">
      <div style="padding:16px 16px 12px;border-bottom:1px solid ${C.border};position:sticky;top:0;background:rgba(10,10,15,.94);backdrop-filter:blur(10px);z-index:10">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div style="font-family:${F.disp};font-size:26px;letter-spacing:.04em">HYROX <span style="color:${C.lime}">SOLO</span></div>
          <div style="font-family:${F.mono};font-size:11px;color:${C.lime}">🏁 ${dtr()}d</div></div>
        <div style="font-family:${F.mono};font-size:9.5px;color:${C.muted};letter-spacing:.06em">SUB 1:20 · FIRST SOLO · 14 NOV 2026</div>
      </div>
      <div style="padding:16px 16px 90px">${inner}</div>
      ${tabbar}
    </div>`;
}

// ── Events ──
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.getAttribute("data-act"),v=t.getAttribute("data-v"),dk=`w${S.week}d${S.day}`;
  if(a==="tab"){S.view=v;render();}
  else if(a==="fuel"){S.fuel=v;render();}
  else if(a==="week"){S.week=+v;S.day=0;render();}
  else if(a==="day"){S.day=+v;render();}
  else if(a==="jump"){S.week=+t.getAttribute("data-w");S.day=+t.getAttribute("data-d");S.view="train";render();}
  else if(a==="ex"){ const id=t.getAttribute("data-id");const d=DATA[dk]||{};const done={...(d.done||{})};done[id]=!done[id];DATA[dk]={...d,done};persist();render(); }
  else if(a==="round"){ const si=+t.getAttribute("data-si"),ri=+t.getAttribute("data-ri");const d=DATA[dk]||{};const fins={...(d.fins||{})};const arr=[...(fins[si]||[])];arr[ri]=!arr[ri];fins[si]=arr;DATA[dk]={...d,fins};persist();render(); }
  else if(a==="complete"){ const d=DATA[dk]||{};DATA[dk]={...d,completed:!d.completed,completedAt:!d.completed?new Date().toISOString():null};persist();render(); }
  else if(a==="bodysave"){
    const root=document.getElementById("root");const g=k=>{const el=root.querySelector(`[data-bf="${k}"]`);return el?el.value:"";};
    if(!g("weight")) return;
    const saved=DATA.__body||JSON.parse(JSON.stringify(BODY_SEED));
    const en={date:g("date"),weight:g("weight"),smm:g("smm"),pbf:g("pbf"),bmr:g("bmr"),vfa:g("vfa"),score:g("score")};
    const entries=[...(saved.entries||[]),en].sort((x,y)=>x.date.localeCompare(y.date));
    DATA.__body={...saved,entries};persist();render();
  }
});
// notes (no re-render, keep focus)
document.addEventListener("input",ev=>{
  const t=ev.target; if(t.getAttribute&&t.getAttribute("data-field")==="note"){
    const dk=t.getAttribute("data-dk");const d=DATA[dk]||{};DATA[dk]={...d,note:t.value};persist();
  }
});

render();

}catch(e){var d=document.getElementById("err");if(d){d.style.display="block";d.textContent="Error:\n"+(e&&e.stack?e.stack:e);}}
</script>
</body>
</html>
